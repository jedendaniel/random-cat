<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Random cat login</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<div th:replace="~{header :: header}">
</div>
<h1>Login page</h1>
<p th:if="${loginError}" class="error">Wrong viewUser or password</p>
<form action="#" th:action="@{/login}" th:object="${viewUser}" method="post">
    <p>Login: <input type="text" th:field="*{username}"/></p>
    <p>Password: <input type="text" th:field="*{password}" /></p>
    <p><input type="submit" value="Submit" /></p>
</form>
<a>No account yet? You can register</a>
<a href="/registration">here</a>
</body>
</html>
