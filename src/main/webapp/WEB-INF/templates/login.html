<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Random cat login</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<div th:replace="~{header :: header}">
</div>
<h1>Login page</h1>
<form action="#" th:action="@{/login-action}" th:object="${userDTO}" method="post">
    <p>Username: <input type="text" th:field="*{username}"/></p>
    <p>Password: <input type="text" th:field="*{password}" /></p>
    <p th:if="${loginError}" class="error" style="color:red">Wrong username or password</p>
    <p><input type="submit" value="Log in" /></p>
</form>
<a>No account yet? You can register</a>
<a href="/registration">here</a>
</body>
</html>
